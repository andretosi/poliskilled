{% extends "base.html" %}
{% block title %}Accedi — PoliSkilled{% endblock %}
{% block content %}
<div class="auth-layout page-width">
    <h1 class="page-title">Accedi</h1>
    <p class="intro">Ritrova i tuoi progressi, su ogni dispositivo.</p>
    <div class="panel auth-form">
        <form method="post">
            {% csrf_token %}{{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="button full">Accedi</button>
        </form>
        <p class="auth-register"><a class="inline-link" href="{% url 'register' %}">Crea il tuo account</a></p>
        <p class="small-note"><a class="inline-link" href="{% url 'accounts:password_reset' %}">Password dimenticata?</a></p>
    </div>
</div>
{% endblock %}
