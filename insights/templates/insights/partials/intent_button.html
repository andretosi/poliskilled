{% if visible %}<div class="intent-control"><button class="button outline small" type="button" data-intent-kind="{{ kind }}" data-intent-id="{{ pk }}" data-intent-url="{{ url }}" data-intent-label="{{ label }}" data-intent-selected-label="{{ selected_label }}" aria-pressed="{{ active|yesno:'true,false' }}">{% if active %}{{ selected_label }}{% else %}{{ label }}{% endif %}</button><span class="small-note" data-intent-status role="status"></span><noscript><p class="small-note">Attiva JavaScript per salvare questa preferenza.</p></noscript></div>{% endif %}
